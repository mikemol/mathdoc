name: docs-ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Validate frontmatter
        run: bash scripts/validate-frontmatter.sh

      - name: Lint markdown
        run: markdownlint . --config .markdownlint.yaml --ignore node_modules --ignore .git

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --verbose --no-progress --exclude-mail
            ./README.md ./content/guides ./content/methods ./content/prompts
            ./indexes ./CONTRIBUTING.md ./GOVERNANCE.md
          fail: true
